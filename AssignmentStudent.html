<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
  }
  .box {
    background: white;
    max-width: 1000px;
    margin: 0 auto 20px auto;
    padding: 20px;
    border-radius: 8px;
  }
  h1 { text-align: center; }
  input {
    padding: 8px;
    margin: 5px;
    width: 180px;
  }
  button {
    padding: 8px 14px;
    margin: 5px;
    cursor: pointer;
  }
  .stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .stat {
    background: #e8e8e8;
    padding: 15px;
    text-align: center;
    flex: 1;
    min-width: 150px;
    border-radius: 6px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    border: 1px solid #999;
    padding: 8px;
    text-align: left;
  }
  th { background: #ddd; }
  .pass { color: green; font-weight: bold; }
  .fail { color: red; font-weight: bold; }
  .table-area { overflow-x: auto; }
</style>
</head>

<body>

<h1>Student Management System</h1>

<!-- ======== FORM ======== -->
<div class="box">
  <h2 id="formTitle">Add Student</h2>

  <input type="text" id="sid" placeholder="Student ID">
  <input type="text" id="name" placeholder="Student Name">
  <input type="text" id="email" placeholder="Email">
  <input type="text" id="course" placeholder="Course">
  <input type="number" id="marks" placeholder="Marks (0-100)">
  <br>
  <button id="addBtn" onclick="saveStudent()">Add Student</button>
  <button id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel</button>
</div>

<!-- ======== STATISTICS ======== -->
<div class="box">
  <h2>Statistics</h2>
  <div class="stats">
    <div class="stat"><h3 id="totalStudents">0</h3>Total Students</div>
    <div class="stat"><h3 id="avgMarks">0</h3>Average Marks</div>
    <div class="stat"><h3 id="topStudent">-</h3>Top Student</div>
  </div>
</div>

<!-- ======== SEARCH + FILTER + TABLE ======== -->
<div class="box">
  <h2>Student List</h2>

  Search:
  <input type="text" id="search" placeholder="Search by name or course..." oninput="showStudents()">

  <br>
  Filter:
  <button onclick="setFilter('all')">All</button>
  <button onclick="setFilter('pass')">Passed</button>
  <button onclick="setFilter('fail')">Failed</button>

  <div class="table-area">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Course</th>
          <th>Marks</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
  // ---------- Variables ----------
  var students = [];          // list of all students
  var editIndex = -1;         // -1 means we are adding, otherwise we are editing this position
  var currentFilter = "all";  // all / pass / fail

  // ---------- Load data from localStorage when page opens ----------
  function loadData() {
    var saved = localStorage.getItem("students");
    if (saved) {
      students = JSON.parse(saved);   // convert text back to array
    }
  }

  // ---------- Save data to localStorage ----------
  function saveData() {
    localStorage.setItem("students", JSON.stringify(students));  // convert array to text
  }

  // ---------- Check email format ----------
  function isValidEmail(email) {
    // simple check: something@something.something
    var pattern = /^[^ ]+@[^ ]+\.[a-z]{2,}$/i;
    return pattern.test(email);
  }

  // ---------- CREATE and UPDATE ----------
  function saveStudent() {
    // 1. read values from the form
    var id = document.getElementById("sid").value.trim();
    var name = document.getElementById("name").value.trim();
    var email = document.getElementById("email").value.trim();
    var course = document.getElementById("course").value.trim();
    var marks = document.getElementById("marks").value;

    // 2. validation
    if (id == "" || name == "" || email == "" || course == "" || marks == "") {
      alert("All fields are required!");
      return;
    }

    if (!isValidEmail(email)) {
      alert("Please enter a valid email!");
      return;
    }

    marks = Number(marks);
    if (marks < 0 || marks > 100) {
      alert("Marks must be between 0 and 100!");
      return;
    }

    // 3. check that ID is unique (ignore the student we are editing)
    for (var i = 0; i < students.length; i++) {
      if (students[i].id == id && i != editIndex) {
        alert("Student ID already exists!");
        return;
      }
    }

    // 4. make the student object
    var student = {
      id: id,
      name: name,
      email: email,
      course: course,
      marks: marks
    };

    // 5. add new or update old
    if (editIndex == -1) {
      students.push(student);          // add
    } else {
      students[editIndex] = student;   // update
      editIndex = -1;
    }

    saveData();
    clearForm();
    showStudents();
  }

  // ---------- Clear the form and go back to "Add" mode ----------
  function clearForm() {
    document.getElementById("sid").value = "";
    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("course").value = "";
    document.getElementById("marks").value = "";

    editIndex = -1;
    document.getElementById("formTitle").innerText = "Add Student";
    document.getElementById("addBtn").innerText = "Add Student";
    document.getElementById("cancelBtn").style.display = "none";
  }

  function cancelEdit() {
    clearForm();
  }

  // ---------- EDIT: put student data back in the form ----------
  function editStudent(index) {
    var s = students[index];

    document.getElementById("sid").value = s.id;
    document.getElementById("name").value = s.name;
    document.getElementById("email").value = s.email;
    document.getElementById("course").value = s.course;
    document.getElementById("marks").value = s.marks;

    editIndex = index;
    document.getElementById("formTitle").innerText = "Edit Student";
    document.getElementById("addBtn").innerText = "Update Student";
    document.getElementById("cancelBtn").style.display = "inline";
  }

  // ---------- DELETE ----------
  function deleteStudent(index) {
    var sure = confirm("Are you sure you want to delete this student?");
    if (sure) {
      students.splice(index, 1);   // remove 1 item at this position
      saveData();
      clearForm();
      showStudents();
    }
  }

  // ---------- FILTER ----------
  function setFilter(type) {
    currentFilter = type;
    showStudents();
  }

  // ---------- READ: show students in the table ----------
  function showStudents() {
    var searchText = document.getElementById("search").value.toLowerCase();
    var rows = "";

    for (var i = 0; i < students.length; i++) {
      var s = students[i];

      // search by name or course
      var matchSearch = s.name.toLowerCase().includes(searchText) ||
                        s.course.toLowerCase().includes(searchText);

      // filter pass / fail
      var matchFilter = true;
      if (currentFilter == "pass" && s.marks < 50) matchFilter = false;
      if (currentFilter == "fail" && s.marks >= 50) matchFilter = false;

      if (matchSearch && matchFilter) {
        var status = "";
        var statusClass = "";
        if (s.marks >= 50) {
          status = "Pass";
          statusClass = "pass";
        } else {
          status = "Fail";
          statusClass = "fail";
        }

        rows += "<tr>" +
          "<td>" + s.id + "</td>" +
          "<td>" + s.name + "</td>" +
          "<td>" + s.email + "</td>" +
          "<td>" + s.course + "</td>" +
          "<td>" + s.marks + "</td>" +
          "<td class='" + statusClass + "'>" + status + "</td>" +
          "<td>" +
            "<button onclick='editStudent(" + i + ")'>Edit</button>" +
            "<button onclick='deleteStudent(" + i + ")'>Delete</button>" +
          "</td>" +
          "</tr>";
      }
    }

    if (rows == "") {
      rows = "<tr><td colspan='7'>No students found</td></tr>";
    }

    document.getElementById("tableBody").innerHTML = rows;
    showStats();
  }

  // ---------- STATISTICS ----------
  function showStats() {
    document.getElementById("totalStudents").innerText = students.length;

    if (students.length == 0) {
      document.getElementById("avgMarks").innerText = "0";
      document.getElementById("topStudent").innerText = "-";
      return;
    }

    var total = 0;
    var top = students[0];

    for (var i = 0; i < students.length; i++) {
      total = total + students[i].marks;
      if (students[i].marks > top.marks) {
        top = students[i];
      }
    }

    var average = total / students.length;
    document.getElementById("avgMarks").innerText = average.toFixed(1);
    document.getElementById("topStudent").innerText = top.name;
  }

  // ---------- Run when page opens ----------
  loadData();
  showStudents();
</script>

</body>
</html>
