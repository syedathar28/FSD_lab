<!DOCTYPE html>
<html>
    <head>
        <title>Internal CSS</title>
        <style>
            h1{
                color: blue;
                text-align: center;
            }

            p{
                font-size: 18px;
                color: green;
            }

            button{
                background-color: yellow;
                color: black;
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <h1>Welcome to Internal CSS</h1>
        <p>This is a paragraph styled using internal CSS.</p>
        <button>Click Me</button>
    </body>
</html>
