<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Management System</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
  }
  .box {
    background: white;
    max-width: 1000px;
    margin: 0 auto 20px auto;
    padding: 20px;
    border-radius: 8px;
  }
  h1 { text-align: center; }
  input, select {
    padding: 8px;
    margin: 5px;
    width: 180px;
  }
  button {
    padding: 8px 14px;
    margin: 5px;
    cursor: pointer;
  }
  .stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .stat {
    background: #e8e8e8;
    padding: 15px;
    text-align: center;
    flex: 1;
    min-width: 150px;
    border-radius: 6px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    border: 1px solid #999;
    padding: 8px;
    text-align: left;
  }
  th { background: #ddd; }
  .available { color: green; font-weight: bold; }
  .low { color: orange; font-weight: bold; }
  .out { color: red; font-weight: bold; }
  .table-area { overflow-x: auto; }
</style>
</head>

<body>

<h1>Inventory Management System</h1>

<!-- ======== FORM ======== -->
<div class="box">
  <h2 id="formTitle">Add Product</h2>

  <input type="text" id="pid" placeholder="Product ID">
  <input type="text" id="pname" placeholder="Product Name">
  <select id="category">
    <option value="">Select Category</option>
    <option value="Electronics">Electronics</option>
    <option value="Clothing">Clothing</option>
    <option value="Food">Food</option>
    <option value="Other">Other</option>
  </select>
  <input type="number" id="price" placeholder="Price">
  <input type="number" id="quantity" placeholder="Quantity">
  <br>
  <button id="addBtn" onclick="saveProduct()">Add Product</button>
  <button id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel</button>
</div>

<!-- ======== STATISTICS ======== -->
<div class="box">
  <h2>Statistics</h2>
  <div class="stats">
    <div class="stat"><h3 id="totalProducts">0</h3>Total Products</div>
    <div class="stat"><h3 id="totalValue">₹0</h3>Total Inventory Value</div>
    <div class="stat"><h3 id="lowStock">0</h3>Low Stock Products</div>
  </div>
</div>

<!-- ======== SEARCH + FILTER + TABLE ======== -->
<div class="box">
  <h2>Inventory List</h2>

  Search:
  <input type="text" id="search" placeholder="Search product..." oninput="showProducts()">

  Category:
  <select id="categoryFilter" onchange="showProducts()">
    <option value="all">All Categories</option>
    <option value="Electronics">Electronics</option>
    <option value="Clothing">Clothing</option>
    <option value="Food">Food</option>
    <option value="Other">Other</option>
  </select>

  <div class="table-area">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Product</th>
          <th>Category</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Status</th>
          <th>Inventory Value</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
  // ---------- Variables ----------
  var products = [];     // list of all products
  var editIndex = -1;    // -1 means adding, otherwise editing this position

  // ---------- Load data from localStorage ----------
  function loadData() {
    var saved = localStorage.getItem("products");
    if (saved) {
      products = JSON.parse(saved);
    }
  }

  // ---------- Save data to localStorage ----------
  function saveData() {
    localStorage.setItem("products", JSON.stringify(products));
  }

  // ---------- CREATE and UPDATE ----------
  function saveProduct() {
    // 1. read values from the form
    var id = document.getElementById("pid").value.trim();
    var name = document.getElementById("pname").value.trim();
    var category = document.getElementById("category").value;
    var price = document.getElementById("price").value;
    var quantity = document.getElementById("quantity").value;

    // 2. validation
    if (id == "" || name == "" || category == "" || price == "" || quantity == "") {
      alert("All fields are required!");
      return;
    }

    price = Number(price);
    quantity = Number(quantity);

    if (price < 0) {
      alert("Price cannot be negative!");
      return;
    }
    if (quantity < 0) {
      alert("Quantity cannot be negative!");
      return;
    }

    // 3. check that ID is unique (ignore the product we are editing)
    for (var i = 0; i < products.length; i++) {
      if (products[i].id == id && i != editIndex) {
        alert("Product ID already exists!");
        return;
      }
    }

    // 4. make the product object
    var product = {
      id: id,
      name: name,
      category: category,
      price: price,
      quantity: quantity
    };

    // 5. add new or update old
    if (editIndex == -1) {
      products.push(product);
    } else {
      products[editIndex] = product;
      editIndex = -1;
    }

    saveData();
    clearForm();
    showProducts();
  }

  // ---------- Clear form and go back to "Add" mode ----------
  function clearForm() {
    document.getElementById("pid").value = "";
    document.getElementById("pname").value = "";
    document.getElementById("category").value = "";
    document.getElementById("price").value = "";
    document.getElementById("quantity").value = "";

    editIndex = -1;
    document.getElementById("formTitle").innerText = "Add Product";
    document.getElementById("addBtn").innerText = "Add Product";
    document.getElementById("cancelBtn").style.display = "none";
  }

  function cancelEdit() {
    clearForm();
  }

  // ---------- EDIT: put product data back in the form ----------
  function editProduct(index) {
    var p = products[index];

    document.getElementById("pid").value = p.id;
    document.getElementById("pname").value = p.name;
    document.getElementById("category").value = p.category;
    document.getElementById("price").value = p.price;
    document.getElementById("quantity").value = p.quantity;

    editIndex = index;
    document.getElementById("formTitle").innerText = "Edit Product";
    document.getElementById("addBtn").innerText = "Update Product";
    document.getElementById("cancelBtn").style.display = "inline";
  }

  // ---------- DELETE ----------
  function deleteProduct(index) {
    var sure = confirm("Are you sure you want to delete this product?");
    if (sure) {
      products.splice(index, 1);
      saveData();
      clearForm();
      showProducts();
    }
  }

  // ---------- QUANTITY CONTROLS ----------
  function increaseQty(index) {
    products[index].quantity = products[index].quantity + 1;
    saveData();
    showProducts();
  }

  function decreaseQty(index) {
    // only decrease if quantity is more than 0 (so it never goes negative)
    if (products[index].quantity > 0) {
      products[index].quantity = products[index].quantity - 1;
      saveData();
      showProducts();
    }
  }

  // ---------- READ: show products in the table ----------
  function showProducts() {
    var searchText = document.getElementById("search").value.toLowerCase();
    var selectedCategory = document.getElementById("categoryFilter").value;
    var rows = "";

    for (var i = 0; i < products.length; i++) {
      var p = products[i];

      // search by name
      var matchSearch = p.name.toLowerCase().includes(searchText);

      // filter by category
      var matchCategory = (selectedCategory == "all" || p.category == selectedCategory);

      if (matchSearch && matchCategory) {
        // find status from quantity
        var status = "";
        var statusClass = "";
        if (p.quantity == 0) {
          status = "Out of Stock";
          statusClass = "out";
        } else if (p.quantity < 5) {
          status = "Low Stock";
          statusClass = "low";
        } else {
          status = "Available";
          statusClass = "available";
        }

        // inventory value = price x quantity
        var value = p.price * p.quantity;

        rows += "<tr>" +
          "<td>" + p.id + "</td>" +
          "<td>" + p.name + "</td>" +
          "<td>" + p.category + "</td>" +
          "<td>₹" + p.price.toLocaleString("en-IN") + "</td>" +
          "<td>" +
            "<button onclick='decreaseQty(" + i + ")'>-</button> " +
            p.quantity +
            " <button onclick='increaseQty(" + i + ")'>+</button>" +
          "</td>" +
          "<td class='" + statusClass + "'>" + status + "</td>" +
          "<td>₹" + value.toLocaleString("en-IN") + "</td>" +
          "<td>" +
            "<button onclick='editProduct(" + i + ")'>Edit</button>" +
            "<button onclick='deleteProduct(" + i + ")'>Delete</button>" +
          "</td>" +
          "</tr>";
      }
    }

    if (rows == "") {
      rows = "<tr><td colspan='8'>No products found</td></tr>";
    }

    document.getElementById("tableBody").innerHTML = rows;
    showStats();
  }

  // ---------- STATISTICS ----------
  function showStats() {
    var totalValue = 0;
    var lowCount = 0;

    for (var i = 0; i < products.length; i++) {
      totalValue = totalValue + (products[i].price * products[i].quantity);

      if (products[i].quantity > 0 && products[i].quantity < 5) {
        lowCount++;
      }
    }

    document.getElementById("totalProducts").innerText = products.length;
    document.getElementById("totalValue").innerText = "₹" + totalValue.toLocaleString("en-IN");
    document.getElementById("lowStock").innerText = lowCount;
  }

  // ---------- Run when page opens ----------
  loadData();
  showProducts();
</script>

</body>
</html>
